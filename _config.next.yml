# Next 主题配置

# 主题风格 (Muse / Mist / Pisces / Gemini)
scheme: Gemini

# 暗色模式
darkmode: true

# 菜单配置
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags
  about: /about/ || fa fa-user

# 社交链接
social:
  GitHub: https://github.com/ggjjc786-boop || fab fa-github
  E-Mail: mailto:ggjjc786@gmail.com || fa fa-envelope

# 头像
avatar:
  url: /images/avatar.png
  rounded: true
  rotated: false

# 代码高亮
codeblock:
  highlight_theme: night eighties
  copy_button:
    enable: true
    style: mac

# 阅读进度条
reading_progress:
  enable: true
  position: top
  color: "#37c6c0"
  height: 3px

# 返回顶部按钮
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# 页脚配置
footer:
  since: 2026
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff0000"
  powered: false

# 字体设置
font:
  enable: true
  global:
    size: 1.0
